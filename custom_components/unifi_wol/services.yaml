wake:
  fields:
    mac:
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
    interface:
      required: false
      example: "br20"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: unifi_wol
    wait:
      required: false
      default: false
      selector:
        boolean:
    timeout:
      required: false
      default: 120
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s
          mode: box
